name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release files
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "widget_home-$TAG.apk"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK=widget_home-$TAG.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: widget_home ${{ env.TAG }}
          files: ${{ env.APK }}
          body: |
            Release built by GitHub Actions.

            - Live prices now come from the free Nerkhsanj API (BrsApi was discontinued) — see #1
            - APK is signed with the debug key (same as previous unsigned builds); not for Play Store upload.
