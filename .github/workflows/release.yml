name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Decrypt release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in android/release.keystore.enc -out "$RUNNER_TEMP/release.keystore" -pass env:KEYSTORE_PASSWORD

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Prepare release files
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "widget_home-$TAG.apk"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK=widget_home-$TAG.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: widget_home ${{ env.TAG }}
          files: ${{ env.APK }}
          body: |
            Release built by GitHub Actions.

            - Live prices now come from the free Nerkhsanj API (BrsApi was discontinued) — see #1
            - Home-screen widget fix: exported receiver + robust parsing — see #4
            - Signed with the project's fixed release key (since v1.0.2), so updates install over previous versions — see #5
